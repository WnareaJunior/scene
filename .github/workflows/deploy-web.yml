# Deploys the web build to GitHub Pages: https://wnareajunior.github.io/scene/
#
# Prerequisites (one-time, already done if the site works):
#   - Repo Pages enabled with build_type "workflow"
#   - Render ALLOWED_ORIGINS includes https://wnareajunior.github.io
#
# The 404.html copy is the Pages SPA fallback: deep links like /scene/feed
# have no file behind them, so Pages serves 404.html — which is the app —
# and the client router takes it from there.
name: deploy-web

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      EXPO_PUBLIC_API_URL: ${{ vars.E2E_API_URL || 'https://scene-19ss.onrender.com' }}
      EXPO_PUBLIC_WEB_BASE_PATH: /scene
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Export web build
        run: npx expo export --platform web
        working-directory: frontend

      - name: Add SPA fallback
        run: cp frontend/dist/index.html frontend/dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - id: deployment
        uses: actions/deploy-pages@v4
